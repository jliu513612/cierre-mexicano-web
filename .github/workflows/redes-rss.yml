name: redes-rss
# Los feeds /assets/redes/feed-facebook.xml y /assets/redes/feed-x.xml ahora se sirven dinamicamente desde
# netlify/functions/redes-rss.mjs leyendo assets/redes/agenda.json y desbloqueando cada fecha a las 08:00 CDMX
# (sin commits automaticos a main, sin violar reglas de rama y sin gastar minutos de compilacion en Netlify).
# Este workflow queda disponible solo a mano para validar agenda.json y la funcion RSS.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-redes-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: probar agenda.json y generador dinamico RSS
        run: node --test .herramientas/pruebas/redes-rss.test.js
