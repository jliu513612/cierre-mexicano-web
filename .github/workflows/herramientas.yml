# Pruebas de /herramientas/ en cada PR. Aprobado por la duena del sitio el 2026-10-13.
#
# Si el PR toca herramientas/, .herramientas/ o _headers, corre:
#   1. las pruebas de la logica contra los vectores de referencia,
#   2. que lo publicado sea exactamente lo que sale de las plantillas y los datos,
#   3. el estilo de los textos,
#   4. la prueba en un navegador: lo que SALE por la red al opinar, y la politica de contenido de _headers,
#   5. la verificacion en negativo (cada sabotaje tiene que poner algo en rojo).
# Si el PR NO toca esas rutas (por ejemplo, un articulo del blog), el check termina en verde sin probar nada:
# no lleva filtro `paths:` a proposito, porque un check requerido que no corre deja el PR bloqueado para siempre.
# Usa `pull_request` (no `pull_request_target`): ejecuta codigo del PR, asi que va SIN secretos y solo con lectura.
name: herramientas
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  herramientas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ¿el PR toca las herramientas?
        id: toca
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(herramientas/|\.herramientas/|_headers$|\.github/workflows/herramientas\.yml$)'; then
            echo "si=1" >> "$GITHUB_OUTPUT"
          else
            echo "No toca /herramientas/: nada que probar."
          fi
      - uses: actions/setup-node@v4
        if: steps.toca.outputs.si == '1'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.toca.outputs.si == '1'
        with:
          python-version: '3.12'
      - name: pruebas contra los vectores de referencia
        if: steps.toca.outputs.si == '1'
        run: node --test ".herramientas/pruebas/*.test.js"
      - name: lo publicado coincide con las plantillas y los datos
        if: steps.toca.outputs.si == '1'
        run: python -X utf8 .herramientas/construir.py --comprobar
      - name: estilo de los textos
        if: steps.toca.outputs.si == '1'
        run: python -X utf8 .herramientas/estilo.py
      - name: navegador (lo que sale por la red y la politica de contenido)
        if: steps.toca.outputs.si == '1'
        run: node .herramientas/prueba_navegador.mjs
      - name: verificacion en negativo
        if: steps.toca.outputs.si == '1'
        run: node .herramientas/verificacion_negativa.mjs
