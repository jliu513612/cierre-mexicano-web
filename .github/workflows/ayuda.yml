# Fuente de /ayuda/ (.ayuda/): la salida del generador no se edita a mano (decision de pauta, 2026-10-27).
# Corre en cada PR, toque lo que toque: es una comprobacion de segundos y un check que no corre no protege nada.
# Usa `pull_request` (no `pull_request_target`): va SIN secretos y solo con lectura.
name: ayuda
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ayuda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: la salida del generador coincide con su sello
        run: node --test .ayuda/pruebas/*.test.js
